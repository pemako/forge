<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 880">
<style>.tt{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}</style>
<defs>
<marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0 8 3 0 6" fill="#6B7280"/></marker>
<marker id="arr-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0 8 3 0 6" fill="#DC2626"/></marker>
<marker id="arr-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0 8 3 0 6" fill="#2563EB"/></marker>
</defs>
<rect width="620" height="880" fill="#F9FAFB"/>
<rect x="10" y="10" width="600" height="860" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="310" y="44" class="tt" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">app.Run() Lifecycle</text>
<line x1="30" y1="54" x2="590" y2="54" stroke="#E5E7EB" stroke-width="1"/>
<circle cx="310" cy="80" r="16" fill="#111827"/>
<text x="310" y="84" class="tt" font-size="10" fill="white" text-anchor="middle">START</text>
<line x1="310" y1="96" x2="310" y2="108" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="180" y="108" width="260" height="40" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
<text x="310" y="127" class="tt" font-size="13" font-weight="bold" fill="#1D4ED8" text-anchor="middle">Migrator.Up()</text>
<text x="310" y="142" class="tt" font-size="10" fill="#60A5FA" text-anchor="middle">goose migrations</text>
<line x1="310" y1="148" x2="310" y2="170" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="180" y="170" width="260" height="40" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
<text x="310" y="189" class="tt" font-size="13" font-weight="bold" fill="#1D4ED8" text-anchor="middle">Lifecycle.Init()</text>
<text x="310" y="204" class="tt" font-size="10" fill="#60A5FA" text-anchor="middle">sequential — each component in order</text>
<line x1="310" y1="210" x2="310" y2="228" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr)"/>
<polygon points="310,228 390,256 310,284 230,256" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
<text x="310" y="261" class="tt" font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">Init error?</text>
<line x1="310" y1="284" x2="310" y2="302" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="340" y="278" width="40" height="14" rx="3" fill="white"/>
<text x="360" y="289" class="tt" font-size="10" fill="#059669" text-anchor="middle">no</text>
<line x1="390" y1="256" x2="530" y2="256" stroke="#DC2626" stroke-width="1.5"/>
<line x1="530" y1="256" x2="530" y2="255" stroke="#DC2626" stroke-width="1.5"/>
<line x1="480" y1="255" x2="530" y2="255" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-r)"/>
<text x="540" y="253" class="tt" font-size="10" fill="#DC2626">yes</text>
<rect x="340" y="248" width="140" height="32" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
<text x="410" y="267" class="tt" font-size="11" font-weight="bold" fill="#B91C1C" text-anchor="middle">Rollback + return err</text>
<rect x="180" y="302" width="260" height="40" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
<text x="310" y="321" class="tt" font-size="13" font-weight="bold" fill="#1D4ED8" text-anchor="middle">BeforeStart hooks</text>
<text x="310" y="336" class="tt" font-size="10" fill="#60A5FA" text-anchor="middle">sequential — first error aborts</text>
<line x1="310" y1="342" x2="310" y2="360" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="180" y="360" width="260" height="44" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="1.5"/>
<text x="310" y="381" class="tt" font-size="13" font-weight="bold" fill="#065F46" text-anchor="middle">Server.Start() &#215; N</text>
<text x="310" y="396" class="tt" font-size="10" fill="#6EE7B7" text-anchor="middle">all servers started concurrently</text>
<line x1="310" y1="404" x2="310" y2="420" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="160" y="420" width="300" height="52" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
<text x="310" y="441" class="tt" font-size="13" font-weight="bold" fill="#F1F5F9" text-anchor="middle">&#9654; Block</text>
<text x="310" y="458" class="tt" font-size="10" fill="#94A3B8" text-anchor="middle">SIGTERM / SIGINT  &#183;&#183;  server error</text>
<line x1="310" y1="472" x2="310" y2="488" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="180" y="488" width="260" height="40" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="1.5"/>
<text x="310" y="507" class="tt" font-size="13" font-weight="bold" fill="#065F46" text-anchor="middle">Server.Stop() &#215; N</text>
<text x="310" y="522" class="tt" font-size="10" fill="#6EE7B7" text-anchor="middle">concurrent &#183; shutdownTimeout</text>
<line x1="310" y1="528" x2="310" y2="546" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="180" y="546" width="260" height="40" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
<text x="310" y="565" class="tt" font-size="13" font-weight="bold" fill="#1D4ED8" text-anchor="middle">Lifecycle.Shutdown()</text>
<text x="310" y="580" class="tt" font-size="10" fill="#60A5FA" text-anchor="middle">reverse registration order</text>
<line x1="310" y1="586" x2="310" y2="604" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="180" y="604" width="260" height="40" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
<text x="310" y="623" class="tt" font-size="13" font-weight="bold" fill="#1D4ED8" text-anchor="middle">Closer.Close()</text>
<text x="310" y="638" class="tt" font-size="10" fill="#60A5FA" text-anchor="middle">registration order &#183; errors collected</text>
<line x1="310" y1="644" x2="310" y2="662" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="180" y="662" width="260" height="40" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
<text x="310" y="681" class="tt" font-size="13" font-weight="bold" fill="#1D4ED8" text-anchor="middle">AfterStop hooks</text>
<text x="310" y="696" class="tt" font-size="10" fill="#60A5FA" text-anchor="middle">sequential &#183; flush telemetry</text>
<line x1="310" y1="702" x2="310" y2="720" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr)"/>
<circle cx="310" cy="738" r="16" fill="#111827"/>
<circle cx="310" cy="738" r="12" fill="none" stroke="white" stroke-width="2"/>
<text x="310" y="742" class="tt" font-size="9" fill="white" text-anchor="middle">END</text>
<text x="170" y="128" class="tt" font-size="10" font-weight="bold" fill="#2563EB" text-anchor="end">① Migrate</text>
<text x="170" y="190" class="tt" font-size="10" font-weight="bold" fill="#2563EB" text-anchor="end">② Init</text>
<text x="170" y="322" class="tt" font-size="10" font-weight="bold" fill="#2563EB" text-anchor="end">③ Hooks</text>
<text x="170" y="382" class="tt" font-size="10" font-weight="bold" fill="#059669" text-anchor="end">④ Start</text>
<text x="170" y="446" class="tt" font-size="10" font-weight="bold" fill="#334155" text-anchor="end">⑤ Wait</text>
<text x="170" y="508" class="tt" font-size="10" font-weight="bold" fill="#059669" text-anchor="end">⑥ Stop</text>
<text x="170" y="566" class="tt" font-size="10" font-weight="bold" fill="#2563EB" text-anchor="end">⑦ Shutdown</text>
<text x="170" y="624" class="tt" font-size="10" font-weight="bold" fill="#2563EB" text-anchor="end">⑧ Close</text>
<text x="170" y="682" class="tt" font-size="10" font-weight="bold" fill="#2563EB" text-anchor="end">⑨ Hooks</text>
<line x1="30" y1="762" x2="590" y2="762" stroke="#F3F4F6" stroke-width="1"/>
<rect x="30" y="782" width="12" height="12" rx="2" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
<text x="46" y="792" class="tt" font-size="10" fill="#374151">Startup / Teardown (sequential)</text>
<rect x="30" y="798" width="12" height="12" rx="2" fill="#F0FDF4" stroke="#10B981" stroke-width="1.2"/>
<text x="46" y="808" class="tt" font-size="10" fill="#374151">Server operations (concurrent)</text>
<rect x="320" y="782" width="12" height="12" rx="2" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
<text x="336" y="792" class="tt" font-size="10" fill="#374151">Branch decision</text>
</svg>