app:
  name: full-example-service
  version: v0.1.0
  env: development

server:
  http:
    addr: :18080
    timeout: 30s
  grpc:
    addr: :19090

database:
  default:
    driver: sqlite
    dsn: "example.db"
    trace_all_sql: true
    slow_threshold: 100ms

# cache.default = memory for regular caching
# cache.redis   = Redis shared by lock + stream
cache:
  default:
    backend: memory
  redis:
    backend: redis
    addr: "localhost:6379"
    password: ""
    db: 0

logger:
  level: debug
  output: both
  filename: logs/app
  max_size: 100
  max_age: 7
  max_backups: 10
  mask_fields:
    - password
    - token

auth:
  secret: "example-jwt-secret-change-in-production"
  expire: 24h

tracing:
  endpoint: "localhost:4317"
  sampler: 1.0

metric:
  prometheus_addr: :19091

# lock uses cache.redis connection (lock.NewFromConfig reads lock.addr)
lock:
  addr: "localhost:6379"

# circuitbreaker per-named thresholds
circuitbreaker:
  jsonplaceholder:
    threshold: 3
    timeout: 10s

# notify channels (leave empty in dev; fill in production)
notify:
  dingtalk_webhook: ""
  wecom_webhook: ""
  feishu_webhook: ""
  email:
    host: ""
    port: 465
    username: ""
    password: ""
    from: ""

# storage (S3/OSS/COS — disabled in dev)
storage:
  provider: s3
  region: us-east-1
  bucket: example-bucket
  access_key: ""
  secret_key: ""
