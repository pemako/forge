syntax = "proto3";

package user.v1;

option go_package = "github.com/pemako/forge/example/03-grpc-service/gen/user/v1;userv1";

service UserService {
  // Login authenticates a user and returns a JWT token.
  rpc Login(LoginRequest) returns (LoginResponse);

  // ListUsers returns a paginated list of users. Requires auth.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // GetUser returns a single user by ID. Requires auth.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // CreateUser creates a new user. Requires auth.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

  // UpdateUser updates an existing user. Requires auth.
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);

  // DeleteUser deletes a user by ID. Requires auth.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}

message User {
  int32  id         = 1;
  string name       = 2;
  string email      = 3;
  string created_at = 4;
}

// ── Auth ──────────────────────────────────────────────────────────────────────

message LoginRequest {
  string email    = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
}

// ── List ─────────────────────────────────────────────────────────────────────

message ListUsersRequest {
  int32 page      = 1; // defaults to 1
  int32 page_size = 2; // defaults to 20, max 100
}

message ListUsersResponse {
  int64          total     = 1;
  int32          page      = 2;
  int32          page_size = 3;
  repeated User  users     = 4;
}

// ── Get ──────────────────────────────────────────────────────────────────────

message GetUserRequest  { int32 id = 1; }
message GetUserResponse { User  user = 1; }

// ── Create ───────────────────────────────────────────────────────────────────

message CreateUserRequest {
  string name  = 1;
  string email = 2;
}
message CreateUserResponse { User user = 1; }

// ── Update ───────────────────────────────────────────────────────────────────

message UpdateUserRequest {
  int32  id    = 1;
  string name  = 2;
  string email = 3;
}
message UpdateUserResponse { User user = 1; }

// ── Delete ───────────────────────────────────────────────────────────────────

message DeleteUserRequest  { int32 id = 1; }
message DeleteUserResponse {}
