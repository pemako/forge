app:
  name: example-service
  version: v0.1.0
  env: development

server:
  http:
    addr: :18080
    timeout: 30s
  grpc:
    addr: :19090

database:
  default:
    driver: sqlite
    dsn: "example.db"
    trace_all_sql: true
    slow_threshold: 100ms

logger:
  level: info
  output: file

tracing:
  endpoint: ""

metric:
  prometheus_addr: :19091

cache:
  default:
    backend: memory
