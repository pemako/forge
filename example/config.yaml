app:
  name: example-service
  version: v0.1.0
  env: development

server:
  http:
    addr: :18080
    timeout: 30s
  grpc:
    addr: :19090

database:
  default:
    driver: sqlite
    dsn: "example.db"
    trace_all_sql: true
    slow_threshold: 100ms

logger:
  level: debug
  output: both           # stdout + file
  filename: logs/app     # 实际文件: logs/app.debug.log / .info.log / .warn.log / .error.log
  max_size: 100          # 单文件最大 MB
  max_age: 7             # 保留天数
  max_backups: 10

tracing:
  endpoint: ""

metric:
  prometheus_addr: :19091

cache:
  default:
    backend: memory
  redis:
    backend: redis
    addr: "redis:6379"    # shared for lock + stream
    password: ""
    db: 0

httpclient:
  jsonplaceholder:
    base_url: "https://jsonplaceholder.typicode.com"
    timeout: 10s
    retry: 2

cron:
  # cron jobs are configured in code, not config file

lock:
  # lock uses Redis; omit if no Redis configured

auth:
  secret: "example-jwt-secret-change-in-production"
  expire: 24h

storage:
  provider: s3
  region: us-east-1
  bucket: my-example-bucket
  access_key: "your-access-key"
  secret_key: "your-secret-key"

notify:
  dingtalk_webhook: ""  # set to enable DingTalk notifications
  wecom_webhook: ""     # set to enable WeCom notifications
  feishu_webhook: ""    # set to enable Feishu notifications
