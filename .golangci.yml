run-settings:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  enable:
    - govet          # go vet checks
    - errcheck       # unchecked errors
    - staticcheck    # staticcheck suite
    - unused         # unused code
    - gosimple       # simplification suggestions
    - ineffassign    # ineffectual assignments
    - typecheck      # type-checks (catches compile errors)
    - gofmt          # formatting
    - goimports      # import ordering
    - misspell       # spelling mistakes in comments/strings
    - unconvert      # unnecessary type conversions
    - godot          # check comment periods
    - noctx          # http.NewRequest without context

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false
  govet:
    enable-all: false
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/pemako/mk
  godot:
    scope: declarations
    capital: false

issues:
  exclude-rules:
    # Test files are less strict
    - path: _test\.go
      linters:
        - errcheck
        - godot

    # Allow exported functions without comment in test helpers
    - path: _test\.go
      text: "exported"

  max-issues-per-linter: 50
  max-same-issues: 10
