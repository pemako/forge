run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  enable:
    - govet # go vet checks
    - errcheck # unchecked errors
    - staticcheck # staticcheck suite
    - unused # unused code
    - gosimple # simplification suggestions
    - ineffassign # ineffectual assignments
    - typecheck # type-checks (catches compile errors)
    - gofmt # formatting
    - misspell # spelling mistakes in comments/strings
    - unconvert # unnecessary type conversions
    - godot # check comment periods
    - noctx # http.NewRequest without context
    - depguard # enforce package import constraints

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false
  govet:
    enable-all: false
  gofmt:
    simplify: true
  godot:
    scope: declarations
    capital: false
  depguard:
    rules:
      # core/ and errors/ are zero-dependency foundations.
      # They must never import any other mk package.
      core-no-mk-imports:
        files:
          - "**/core/*.go"
          - "!**/*_test.go"
        deny:
          - pkg: "github.com/pemako/mk/"
            desc: "core/ must not import any other mk package — it is the zero-dependency foundation"
      errors-no-mk-imports:
        files:
          - "**/errors/*.go"
          - "!**/*_test.go"
        deny:
          - pkg: "github.com/pemako/mk/"
            desc: "errors/ must not import any other mk package — it is the zero-dependency foundation"
      # app/ must not import infrastructure packages.
      # All dependencies are passed in as interface values (core.Server, app.Lifecycle, etc.).
      app-no-infra-imports:
        files:
          - "**/app/*.go"
          - "!**/*_test.go"
        deny:
          - pkg: "github.com/pemako/mk/database"
            desc: "app/ must not import database directly; pass *database.Manager as app.Migrator"
          - pkg: "github.com/pemako/mk/cache"
            desc: "app/ must not import cache directly; pass *cache.Manager as app.Closer"
          - pkg: "github.com/pemako/mk/metric"
            desc: "app/ must not import metric directly; pass *metric.Provider as app.Lifecycle"
          - pkg: "github.com/pemako/mk/tracing"
            desc: "app/ must not import tracing directly; pass *tracing.Provider as app.Lifecycle"
          - pkg: "github.com/pemako/mk/server/http"
            desc: "app/ must not import server packages; pass servers via core.Server interface"
          - pkg: "github.com/pemako/mk/server/grpc"
            desc: "app/ must not import server packages; pass servers via core.Server interface"
          - pkg: "github.com/pemako/mk/middleware/http"
            desc: "app/ must not import middleware packages"
          - pkg: "github.com/pemako/mk/middleware/grpc"
            desc: "app/ must not import middleware packages"

issues:
  exclude-rules:
    # Test files are less strict
    - path: _test\.go
      linters:
        - errcheck
        - godot
        - noctx

    # Allow exported functions without comment in test helpers
    - path: _test\.go
      text: "exported"

    # gorm callback Register() returns error that cannot be meaningfully handled at plugin init
    - path: database/plugin\.go
      linters:
        - errcheck

    # db.Use() plugin registration error is non-actionable at startup
    - path: database/database\.go
      linters:
        - errcheck

    # defer l.Release in TryLock: defer cannot propagate error; failure is logged internally
    - path: lock/lock\.go
      linters:
        - errcheck

    # srv.Stop runs in a goroutine during shutdown; error cannot be surfaced to caller
    - path: app/app\.go
      linters:
        - errcheck

    # fmt.Sscanf in parseSize: parse failure falls back to default (8MB), no action needed
    - path: middleware/http/body_limit\.go
      linters:
        - errcheck

    # godot: comment ending in *** is not a missing period
    - path: logger/logger\.go
      text: "Comment should end in a period"
      linters:
        - godot

  max-issues-per-linter: 50
  max-same-issues: 10
